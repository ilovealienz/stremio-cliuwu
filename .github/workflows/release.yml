name: Release

on:
  # Manual runs need a tag passed in: workflow_dispatch runs against a branch,
  # so GITHUB_REF is refs/heads/main and there's nothing for the release step
  # to attach to. Useful when GitHub drops the tag push event.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, e.g. v0.3.4.1"
        required: true
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build and release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # On a manual run the default checkout is the branch tip, which may
          # be ahead of the tag. Build exactly what was tagged.
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Resolve tag and version
        id: version
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          echo "TAG=${TAG}" >> $GITHUB_OUTPUT
          echo "VERSION=${TAG#v}" >> $GITHUB_OUTPUT
          echo "releasing ${TAG}"

      - name: Build
        run: |
          set -eu
          mkdir -p dist
          LDFLAGS="-s -w -X main.version=${{ steps.version.outputs.VERSION }}"

          build() {
            echo "  $1/$2"
            CGO_ENABLED=0 GOOS="$1" GOARCH="$2" \
              go build -trimpath -ldflags="$LDFLAGS" -o "dist/$3" .
          }

          build linux   amd64 stremio-cliuwu-linux-amd64
          build linux   arm64 stremio-cliuwu-linux-arm64
          build windows amd64 stremio-cliuwu-windows-amd64.exe
          build darwin  arm64 stremio-cliuwu-darwin-arm64

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          name: ${{ steps.version.outputs.TAG }}
          files: dist/*
          generate_release_notes: true
